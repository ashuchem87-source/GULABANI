workflows:
  android-apk:
    name: GULABANI Android APK
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      node: 22.11.0
      java: 17

    scripts:
      - name: Setup pnpm
        script: |
          npm install -g corepack@latest
          corepack enable
          corepack prepare pnpm@12.5.1 --activate

      - name: Install dependencies
        script: |
          pnpm install --frozen-lockfile

      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/artifacts/flowpilot/android/local.properties"

      - name: Check Java version
        script: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Build Android Release APK
        script: |
          cd "$CM_BUILD_DIR/artifacts/flowpilot/android"
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace --info

    artifacts:
      - artifacts/flowpilot/android/app/build/outputs/**/*.apk